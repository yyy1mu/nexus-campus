# Nexus Campus - local services
# Start MySQL with: docker compose up -d mysql

services:
  mysql:
    image: mysql:8.0
    container_name: nexus-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: nexus_root_pwd
      MYSQL_DATABASE: nexus_campus
      MYSQL_USER: nexus
      MYSQL_PASSWORD: nexus_pwd
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
