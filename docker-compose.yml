name: nexus-campus

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: nexus-campus-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    init: true
    restart: unless-stopped
    environment:
      # 绑定域名（如 campus.example.com）后 Caddy 自动签发并续期 HTTPS 证书；
      # 留空则为 :80 纯 HTTP 本地模式
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-${NGINX_HTTP_PORT:-80}}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      # 证书与 ACME 账户数据持久化，容器重建不丢
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - edge

  backend:
    image: nexus-campus-backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/server.Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-7d}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-nexus_campus}
      DB_USERNAME: ${MYSQL_USER:-nexus}
      DB_PASSWORD: ${MYSQL_PASSWORD:-nexus_pwd}
      DB_USE_SSL: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - edge
      - data

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nexus_root_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexus_campus}
      MYSQL_USER: ${MYSQL_USER:-nexus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nexus_pwd}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          -u "$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --execute="SELECT 1" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - data

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - data

  # 一次性演示数据导入：等后端建表完成后执行 scripts/seed-demo.sql（幂等）。
  # 仅演示/开发环境使用：docker compose --profile seed up -d
  seed:
    image: mysql:8.0
    profiles: ["seed"]
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./scripts/seed-demo.sql:/seed.sql:ro
    command:
      - sh
      - -c
      - >-
        mysql -h mysql -P 3306
        -u "$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" "$${MYSQL_DATABASE}"
        < /seed.sql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexus_campus}
      MYSQL_USER: ${MYSQL_USER:-nexus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nexus_pwd}
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - data

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
