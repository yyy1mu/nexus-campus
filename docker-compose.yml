# Nexus Campus — Docker Compose
# Start with: docker compose up -d
# MySQL uses port 3307 to avoid clashing with local installs.
version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: nexus-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: nexus_root_pwd
      MYSQL_DATABASE: nexus_flarum
      MYSQL_USER: nexus
      MYSQL_PASSWORD: nexus_pwd
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/main/resources/db/migration/V1__nexus_schema_init.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  mysql_data:
