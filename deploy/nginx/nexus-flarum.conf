server {
    listen 0.0.0.0:18080;
    listen [::]:18080;
    server_name localhost 127.0.0.1 _;

    root /mnt/d/Nexus/workspace/flarum/public;
    index index.html index.php;
    charset utf-8;
    client_max_body_size 50M;

    include /mnt/d/Nexus/workspace/flarum/deploy/nginx/flarum-location.conf;

    # Local development changes Flarum assets often. Avoid stale cached JS/CSS
    # causing the fallback "Something went wrong" page after cache rebuilds.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log off;
    }

    location = /docs/ {
        try_files /docs/index.html =404;
    }

    location /docs/ {
        try_files $uri =404;
    }

    location ~ ^/docs/.*\.md$ {
        try_files $uri =404;
        types { text/markdown md; }
        default_type text/markdown;
        charset utf-8;
        add_header Cache-Control "max-age=0";
    }

    location ~ \.php$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
    }

    location ~ /\. {
        deny all;
    }
}
